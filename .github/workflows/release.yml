name: release

# Every push to main builds, tests and publishes a GitHub Release with ready-to-install files.
# Version: MAJOR.MINOR from project(... VERSION x.y.z) in CMakeLists.txt; PATCH counts up from the
# last released v<MAJOR>.<MINOR>.N tag. Bump MAJOR/MINOR by editing CMakeLists.txt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order, so two quick pushes never claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need tags
      - id: v
        run: |
          BASE=$(sed -nE 's/^project\(WingReaperFollow VERSION ([0-9]+)\.([0-9]+)\.[0-9]+.*/\1.\2/p' CMakeLists.txt)
          [ -n "$BASE" ] || { echo "could not read the version from CMakeLists.txt"; exit 1; }
          LAST=$(git tag -l "v$BASE.*" | grep -E "^v${BASE//./\\.}\.[0-9]+$" | sort -V | tail -1 || true)
          if [ -z "$LAST" ]; then PATCH=0; else PATCH=$(( ${LAST##*.} + 1 )); fi
          echo "version=$BASE.$PATCH" >> "$GITHUB_OUTPUT"
          echo "Releasing $BASE.$PATCH (previous: ${LAST:-none})"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Install

          **Quit REAPER first**, then:

          - **Windows:** run \`WING-Follow-${VERSION}-Windows-Setup.exe\`. It installs for your user into \`%APPDATA%\\REAPER\\UserPlugins\` (no admin needed). For a portable REAPER, pick that install's \`UserPlugins\` folder on the folder page.
          - **macOS:** open \`WING-Follow-${VERSION}-macOS.pkg\`. It installs for your user into \`~/Library/Application Support/REAPER/UserPlugins\`. The package is not notarized: if macOS blocks it, right-click it and choose **Open**, or allow it under *System Settings > Privacy & Security*.

          Then start REAPER and open **Extensions > WING Follow > Show window**.

          The bare \`.dll\` / \`.dylib\` files are attached too, for manual installs: copy one into \`UserPlugins\`. A downloaded \`.dylib\` may need \`xattr -d com.apple.quarantine <file>\`.

          EOF
      - name: Create release (and tag)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "WING Follow $VERSION" --notes-file notes.md --generate-notes --latest
