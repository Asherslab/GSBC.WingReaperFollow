<h3>WING Follow for REAPER @DISPLAY_VERSION@</h3>
<p>Makes REAPER tracks follow a Behringer WING's faders and mutes, for an unattended livestream mix.</p>
<p>This installs the extension for your user account into<br>
<code>~/Library/Application Support/REAPER/UserPlugins</code>.</p>
<p>Please quit REAPER before continuing.</p>
</body></html>
