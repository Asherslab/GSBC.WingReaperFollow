<html><body style="font-family: -apple-system, Helvetica; font-size: 13px;">
<h3>Installed</h3>
<p>Start REAPER, then open <b>Extensions &gt; WING Follow &gt; Show window</b>.</p>
<p>To uninstall, delete <code>reaper_wingfollow.dylib</code> from
<code>~/Library/Application Support/REAPER/UserPlugins</code>.</p>
</body></html>
